<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review stories · Good News Everywhere</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .admin { max-width: 760px; margin: 0 auto; padding: 24px var(--gutter) 80px; }
  .admin h1 { font-size: clamp(2rem, 6vw, 3.4rem); margin-bottom: 20px; }
  .login { display: flex; gap: 10px; margin-bottom: 28px; }
  @media (max-width: 560px) { .login { flex-direction: column; } }
  .login .btn { white-space: nowrap; }
  .login input { flex: 1; font: 400 1rem var(--body); padding: 12px 16px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
  .sub { background: var(--paper); border-radius: 24px 24px 24px 6px; padding: 20px 24px; margin-bottom: 14px; }
  .sub h2 { font-size: 1.3rem; margin-bottom: 6px; }
  .sub p { margin: 6px 0; }
  .sub .meta { color: var(--ink-soft); font: 500 0.88rem var(--display); }
  .sub .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .sub select { font: 500 0.95rem var(--display); padding: 8px 12px; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
  .sub .btn { padding: 10px 20px; }
  .btn.quiet { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  .state { font: 700 0.85rem var(--display); padding: 3px 12px; border-radius: 999px; background: var(--sun); color: #13264a; }
  .state.approved { background: var(--leaf); color: #fff; } .state.rejected { background: var(--coral); }
  .msg { min-height: 1.5em; color: var(--ink-soft); }
</style>
</head>
<body>
<main class="admin">
  <h1>Review stories</h1>
  <form class="login" id="login">
    <input type="password" id="token" placeholder="Admin token" aria-label="Admin token" autocomplete="current-password">
    <button class="btn" type="submit">Open the queue</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <div id="list"></div>
</main>
<script src="admin.js"></script>
</body>
</html>
